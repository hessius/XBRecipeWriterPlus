name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci

      # Catches dependency versions drifting out of step with the installed
      # Expo SDK, which is how this project ended up a year stale in the first
      # place. All 21 checks pass today, so this is a hard failure; the
      # exceptions we have deliberately accepted live in package.json's
      # expo.doctor config.
      - name: Expo Doctor
        run: npx expo-doctor
